<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SO-101 Joint Control</title>
  <style>
    :root { font: 15px/1.4 system-ui, -apple-system, sans-serif; color: #eaf1f5; background: #10191f; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1150px; margin: auto; }
    h1 { font-size: 2rem; letter-spacing: -.035em; margin: 0; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .muted, small { color: #aebec7; }
    .subtitle { margin: 5px 0 0; }
    .status { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: #1e3039; color: #b9dce0; }
    .status.error { background: #4b2024; color: #ffe0e0; }
    button { color: inherit; font: inherit; cursor: pointer; border: 1px solid #506570; background: #263841; border-radius: 9px; padding: 9px 13px; min-height: 41px; touch-action: none; user-select: none; }
    button:hover { background: #35505b; }
    button:focus-visible { outline: 3px solid #7ed7dc; outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    .top-actions { display: flex; gap: 8px; }
    .hold-all { background: #235960; border-color: #559aa0; font-weight: 700; white-space: nowrap; }
    .release { background: #6e2c31; border-color: #ad555a; font-weight: 700; white-space: nowrap; }
    .release:hover { background: #88373d; }
    .grid { display: grid; gap: 12px; }
    .joint { background: #1c2a32; border: 1px solid #33454f; border-radius: 14px; padding: 17px; display: grid; grid-template-columns: minmax(155px,1.2fr) minmax(215px,1.5fr) minmax(180px,1fr) minmax(245px,1.5fr); gap: 16px; align-items: center; }
    .joint.moving { border-color: #7ed7dc; box-shadow: inset 0 0 0 1px #7ed7dc; }
    .joint.faulted { border-color: #bf6268; }
    .identity { display: flex; align-items: center; gap: 12px; }
    .number { display: grid; place-items: center; flex: 0 0 38px; height: 38px; border-radius: 11px; background: #344e59; font-weight: 800; font-size: 1.2rem; }
    .name { font-weight: 700; font-size: 1.06rem; }
    .readings { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 5px; font-size: .85rem; color: #aebec7; }
    .group-label { text-transform: uppercase; letter-spacing: .1em; color: #aebec7; font-size: .7rem; font-weight: 700; margin-bottom: 7px; }
    .movement { display: flex; gap: 7px; }
    .movement button { flex: 1; font-weight: 700; }
    .movement button.active { background: #197f86; border-color: #7ed7dc; }
    .scales { display: flex; gap: 4px; }
    .scales button { flex: 1; min-width: 0; padding: 8px 5px; }
    .scales button.selected { background: #237c81; border-color: #8ae0e2; font-weight: 800; }
    .limits { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .limit { background: #24343d; border-radius: 8px; padding: 7px; }
    .limit-value { font-weight: 700; margin-bottom: 5px; }
    .limit-actions { display: flex; gap: 4px; }
    .limit-actions button { flex: 1; font-size: .78rem; min-height: 32px; padding: 4px; }
    .goto { grid-column: 1 / -1; display: flex; align-items: end; gap: 8px; flex-wrap: wrap; }
    .goto input { width: 120px; min-height: 41px; padding: 8px; border-radius: 9px; border: 1px solid #506570; background: #10191f; color: inherit; font: inherit; }
    .hint { margin: 18px 0; font-size: .9rem; }
    @media (max-width: 1000px) { .joint { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { body { padding: 14px; } .top { flex-direction: column; } .top-actions { width: 100%; } .top-actions button { flex: 1; white-space: normal; } .joint { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div><h1>SO-101 Joint Control</h1><p class="subtitle muted">Hold a direction to move any joint. Release to hold its measured position.</p><p class="subtitle muted" id="folded-pose"></p></div>
      <div class="top-actions"><button class="hold-all" id="hold-all">Hold all joints</button><button class="release" id="release" disabled title="Set and verify the coiled rest pose first">Torque release unavailable</button></div>
    </div>
    <div id="status" class="status">Connecting to the arm…</div>
    <div id="joints" class="grid"></div>
    <p class="hint muted">Forward increases encoder ticks. Each joint has saved limits and a 1×, 2×, 4×, or 8× hold speed. Torque remains on when a hold ends or this panel closes.</p>
  </main>
  <script>
    const joints = document.getElementById('joints');
    const statusBox = document.getElementById('status');
    let press = null;
    let rowsBuilt = false;

    async function api(path, data) {
      const response = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data), cache: 'no-store', keepalive: path === '/api/hold/stop'});
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `Request failed (${response.status})`);
      return result;
    }
    function show(message, error = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle('error', error);
    }
    function buildRows(motors) {
      for (const motor of motors) {
        const row = document.createElement('section');
        row.className = 'joint'; row.dataset.motor = motor.id;
        row.innerHTML = `<div><div class="identity"><span class="number">${motor.id}</span><span class="name">${motor.name}</span></div><div class="readings"><span class="position"></span><span class="goal"></span><span class="voltage"></span><span class="temperature"></span><span class="torque"></span><span class="fault"></span><span class="boundary"></span></div></div>
          <div><div class="group-label">Press and hold</div><div class="movement"><button class="backward" data-direction="-1">◀ Backward</button><button class="forward" data-direction="1">Forward ▶</button></div></div>
          <div><div class="group-label">Hold speed</div><div class="scales">${[1,2,4,8].map(x => `<button data-scale="${x}" aria-label="Motor ${motor.id}, ${x} times speed">${x}×</button>`).join('')}</div></div>
          <div><div class="group-label">Saved joint limits · ticks</div><div class="limits">${['lower','upper'].map(bound => `<div class="limit"><div class="limit-value ${bound}"></div><div class="limit-actions"><button data-bound="${bound}" data-clear="false">Save ${bound}</button><button data-bound="${bound}" data-clear="true">Clear</button></div></div>`).join('')}</div></div>
          ${motor.id === 6 ? `<form class="goto"><label><span class="group-label">Motor 6 target · ticks</span><br><input type="number" step="1" min="${motor.firmware_lower}" max="${motor.firmware_upper}" value="${motor.position}" required></label><button type="submit">Go to tick</button></form>` : ''}`;
        row.querySelectorAll('[data-direction]').forEach(button => {
          button.addEventListener('pointerdown', event => { event.preventDefault(); button.setPointerCapture(event.pointerId); beginPress(motor.id, Number(button.dataset.direction), button); });
          button.addEventListener('pointerup', endPress);
          button.addEventListener('pointercancel', endPress);
          button.addEventListener('lostpointercapture', endPress);
          button.addEventListener('keydown', event => { if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) { event.preventDefault(); beginPress(motor.id, Number(button.dataset.direction), button); } });
          button.addEventListener('keyup', event => { if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); endPress(); } });
        });
        row.querySelectorAll('[data-scale]').forEach(button => button.addEventListener('click', async () => {
          try { await api('/api/scale', {motor: motor.id, scale: Number(button.dataset.scale)}); await refresh(); }
          catch (error) { show(error.message, true); }
        }));
        row.querySelectorAll('[data-bound]').forEach(button => button.addEventListener('click', async () => {
          try { await api('/api/limit', {motor: motor.id, bound: button.dataset.bound, clear: button.dataset.clear === 'true'}); await refresh(); show(`Motor ${motor.id} limits saved.`); }
          catch (error) { show(error.message, true); }
        }));
        const goForm = row.querySelector('.goto');
        if (goForm) goForm.addEventListener('submit', async event => {
          event.preventDefault(); endPress();
          try {
            const target = Number(goForm.querySelector('input').value);
            if (!Number.isInteger(target)) throw new Error('Enter a whole-number tick target.');
            await api('/api/motor6/go', {target});
            show(`Moving motor 6 toward ${target} ticks.`);
          } catch (error) { show(error.message, true); }
        });
        joints.appendChild(row);
      }
      rowsBuilt = true;
    }
    async function beginPress(motor, direction, button) {
      endPress();
      const current = {motor, button, active: true, token: null, timer: null};
      press = current;
      button.classList.add('active');
      try {
        const result = await api('/api/hold/start', {motor, direction});
        current.token = result.token;
        if (!current.active) { await api('/api/hold/stop', {token: current.token}); return; }
        current.timer = setInterval(async () => {
          if (!current.active) return;
          try { await api('/api/hold/heartbeat', {token: current.token}); }
          catch (error) { show(error.message, true); endPress(); }
        }, 200);
      } catch (error) { show(error.message, true); endPress(); }
    }
    function endPress() {
      if (!press) return;
      const current = press;
      press = null;
      current.active = false;
      current.button.classList.remove('active');
      if (current.timer) clearInterval(current.timer);
      if (current.token) api('/api/hold/stop', {token: current.token}).catch(error => show(error.message, true));
    }
    async function refresh() {
      try {
        const response = await fetch('/api/state', {cache: 'no-store'});
        const state = await response.json();
        if (!response.ok) throw new Error(state.error || 'Could not read arm');
        if (!rowsBuilt) buildRows(state.motors);
        for (const m of state.motors) {
          const row = joints.querySelector(`[data-motor="${m.id}"]`);
          row.classList.toggle('moving', state.holding === m.id);
          row.classList.toggle('faulted', Boolean(m.fault));
          row.querySelector('.position').textContent = `${m.position} ticks`;
          row.querySelector('.goal').textContent = `target ${m.goal}`;
          row.querySelector('.voltage').textContent = `${m.voltage.toFixed(1)} V`;
          row.querySelector('.temperature').textContent = `${m.temperature} °C`;
          row.querySelector('.torque').textContent = m.torque ? 'Holding' : 'Free';
          row.querySelector('.fault').textContent = m.fault || '';
          row.querySelector('.backward').disabled = !m.motion_enabled || !m.can_backward;
          row.querySelector('.forward').disabled = !m.motion_enabled || !m.can_forward;
          row.querySelector('.boundary').textContent = !m.can_backward ? 'Lower end · Forward available' : !m.can_forward ? 'Upper end · Backward available' : '';
          row.querySelector('.lower').textContent = `Lower: ${m.lower ?? 'unset'}`;
          row.querySelector('.upper').textContent = `Upper: ${m.upper ?? 'unset'}`;
          const goForm = row.querySelector('.goto');
          if (goForm) {
            const input = goForm.querySelector('input');
            input.min = m.effective_lower;
            input.max = m.effective_upper;
            goForm.querySelector('button').disabled = !m.motion_enabled || Boolean(m.fault);
          }
          row.querySelectorAll('[data-scale]').forEach(button => button.classList.toggle('selected', Number(button.dataset.scale) === m.scale));
        }
        const faulted = state.motors.filter(m => m.fault).map(m => m.id);
        if (state.folded_ticks) document.getElementById('folded-pose').textContent =
          `Saved folded ticks 1–6: ${Object.values(state.folded_ticks).join(' · ')}`;
        document.getElementById('hold-all').disabled = !state.hold_all_enabled;
        if (state.error) show(state.error, true);
        else if (faulted.length) show(`Servo fault on motor${faulted.length > 1 ? 's' : ''} ${faulted.join(', ')}.`, true);
        else if (state.holding === 6 && !press) show('Motor 6 moving to target');
        else if (!press) show(state.motion_enabled ? 'All six joints ready · release a direction to hold position' : 'Torque is off · use Hold all joints to enable movement');
        else show(`Moving motor ${press.motor} · release to stop`);
      } catch (error) { show(error.message, true); endPress(); }
    }
    document.getElementById('release').addEventListener('click', async () => {
      endPress();
      try { await api('/api/release', {}); await refresh(); show('All torque released. Support the arm.'); }
      catch (error) { show(error.message, true); }
    });
    document.getElementById('hold-all').addEventListener('click', async () => {
      endPress();
      try { await api('/api/hold-all', {}); await refresh(); show('All six joints are holding their current positions.'); }
      catch (error) { show(error.message, true); }
    });
    window.addEventListener('blur', endPress);
    window.addEventListener('pointerup', endPress);
    window.addEventListener('pointercancel', endPress);
    document.addEventListener('visibilitychange', () => { if (document.hidden) endPress(); });
    window.addEventListener('pagehide', endPress);
    refresh(); setInterval(refresh, 1000);
  </script>
</body>
</html>
